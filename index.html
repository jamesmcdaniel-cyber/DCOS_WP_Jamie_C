<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Demo Hub | Backstory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070c13;
  --bg-rail: #05090f;
  --grid-line: rgba(255, 255, 255, 0.032);
  --grid-size: 64px;
  --text: #eef3f9;
  --muted: #8fa0b4;
  --muted-dim: #63748a;
  --line: rgba(255, 255, 255, 0.08);
  --accent: #6ba0e8;
  --accent-soft: rgba(107, 160, 232, 0.1);
  --accent-line: rgba(107, 160, 232, 0.3);
  --rail-w: 288px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body { height: 100%; }

body {
  font-family: "Inter", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  -webkit-font-smoothing: antialiased;
}

button, input, a { font: inherit; color: inherit; }
a { text-decoration: none; }

:focus-visible {
  outline: 2px solid var(--accent);
  outline-offset: 3px;
  border-radius: 4px;
}

.app {
  display: grid;
  grid-template-columns: var(--rail-w) minmax(0, 1fr);
  height: 100%;
}

/* ---------- Sidebar ---------- */

.rail {
  display: flex;
  flex-direction: column;
  border-right: 1px solid var(--line);
  background: var(--bg-rail);
  overflow-y: auto;
}

.rail-head {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 26px 22px 22px;
}

.rail-mark {
  width: 9px;
  height: 9px;
  border-radius: 50%;
  background: var(--accent);
  box-shadow: 0 0 0 4px rgba(107, 160, 232, 0.14);
  flex-shrink: 0;
}

.rail-brand {
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--muted);
}

.nav-group {
  display: flex;
  align-items: center;
  gap: 4px;
  padding: 0 12px 0 16px;
}

.group-toggle {
  display: flex;
  align-items: center;
  justify-content: center;
  width: 30px;
  height: 30px;
  border: none;
  border-radius: 8px;
  background: transparent;
  color: var(--muted);
  cursor: pointer;
  transition: background 0.16s ease, color 0.16s ease;
}

.group-toggle:hover { background: rgba(255, 255, 255, 0.05); color: var(--text); }

.group-toggle svg { transition: transform 0.2s ease; }
.group-toggle[aria-expanded="false"] svg { transform: rotate(180deg); }

.group-link {
  flex: 1;
  padding: 8px 10px;
  border-radius: 8px;
  font-size: 17px;
  font-weight: 500;
  letter-spacing: -0.01em;
  color: var(--text);
  transition: background 0.16s ease;
}

.group-link:hover { background: rgba(255, 255, 255, 0.05); }

.nav-list {
  list-style: none;
  padding: 4px 12px 20px 22px;
}

.nav-list[hidden] { display: none; }

.nav-link {
  display: block;
  position: relative;
  padding: 9px 12px 9px 22px;
  border-radius: 8px;
  font-size: 14px;
  line-height: 1.35;
  color: var(--muted);
  transition: color 0.16s ease, background 0.16s ease;
}

.nav-link::before {
  content: "";
  position: absolute;
  left: 6px;
  top: 12px;
  bottom: 12px;
  width: 2px;
  border-radius: 2px;
  background: transparent;
  transition: background 0.16s ease, top 0.16s ease, bottom 0.16s ease;
}

.nav-link:hover {
  color: var(--text);
  background: rgba(255, 255, 255, 0.04);
}

.nav-link:hover::before { background: var(--line); top: 8px; bottom: 8px; }

.nav-link.active {
  color: var(--text);
  background: var(--accent-soft);
}

.nav-link.active::before { background: var(--accent); top: 8px; bottom: 8px; }

/* ---------- Main column ---------- */

.main {
  position: relative;
  display: flex;
  flex-direction: column;
  min-width: 0;
  overflow: hidden;
  background:
    radial-gradient(ellipse 70% 55% at 50% 42%, rgba(107, 160, 232, 0.07), transparent 70%),
    linear-gradient(var(--grid-line) 1px, transparent 1px) 0 0 / var(--grid-size) var(--grid-size),
    linear-gradient(90deg, var(--grid-line) 1px, transparent 1px) 0 0 / var(--grid-size) var(--grid-size),
    var(--bg);
}

.topbar {
  display: none;
  align-items: center;
  gap: 14px;
  height: 62px;
  padding: 0 20px;
  border-bottom: 1px solid var(--line);
  background: rgba(7, 12, 19, 0.86);
  backdrop-filter: blur(14px);
  flex-shrink: 0;
}

body[data-view="demo"] .topbar { display: flex; }

.crumb {
  min-width: 0;
  font-size: 15px;
  font-weight: 500;
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.crumb-home {
  color: var(--muted);
  transition: color 0.16s ease;
}

.crumb-home:hover { color: var(--text); }

.crumb-sep { color: var(--muted-dim); margin: 0 8px; }

body[data-view="home"] .crumb-home { color: var(--text); }

body[data-view="home"] .crumb-sep,
body[data-view="home"] #crumbCurrent,
body[data-view="home"] #openDirect { display: none; }

.bar-btn {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  height: 36px;
  padding: 0 13px;
  border: 1px solid var(--line);
  border-radius: 10px;
  background: rgba(255, 255, 255, 0.03);
  font-size: 13px;
  cursor: pointer;
  white-space: nowrap;
  transition: background 0.16s ease, border-color 0.16s ease;
}

.bar-btn:hover { background: rgba(255, 255, 255, 0.07); border-color: rgba(255, 255, 255, 0.16); }

.spacer { flex: 1; }

.rail-toggle { display: none; }

.scrim {
  display: none;
  position: fixed;
  inset: 0;
  z-index: 30;
  background: rgba(3, 6, 10, 0.6);
}

/* ---------- Home view ---------- */

.home {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 64px 28px 96px;
  text-align: center;
}

body[data-view="demo"] .home { display: none; }

.badge {
  display: inline-flex;
  align-items: center;
  gap: 10px;
  padding: 9px 16px;
  border: 1px solid var(--accent-line);
  border-radius: 6px;
  background: var(--accent-soft);
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  color: var(--accent);
}

.badge span {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: currentColor;
}

.home h1 {
  margin-top: 34px;
  font-size: clamp(52px, 8.5vw, 104px);
  font-weight: 800;
  line-height: 0.98;
  letter-spacing: -0.045em;
}

.home p {
  max-width: 30ch;
  margin-top: 22px;
  font-size: clamp(17px, 1.6vw, 20px);
  font-weight: 300;
  line-height: 1.65;
  color: var(--muted);
}

.home hr {
  width: 52px;
  margin-top: 54px;
  border: none;
  border-top: 1px solid rgba(255, 255, 255, 0.16);
}

.home-foot {
  position: absolute;
  left: 0;
  right: 0;
  bottom: 30px;
  text-align: center;
  font-family: "IBM Plex Mono", ui-monospace, monospace;
  font-size: 11px;
  letter-spacing: 0.16em;
  color: var(--muted-dim);
}

body[data-view="demo"] .home-foot { display: none; }

.reveal {
  opacity: 0;
  transform: translateY(12px);
  animation: rise 0.7s cubic-bezier(0.2, 0.7, 0.3, 1) forwards;
}

.reveal:nth-child(1) { animation-delay: 0.05s; }
.reveal:nth-child(2) { animation-delay: 0.14s; }
.reveal:nth-child(3) { animation-delay: 0.23s; }
.reveal:nth-child(4) { animation-delay: 0.34s; }

@keyframes rise {
  to { opacity: 1; transform: none; }
}

/* ---------- Viewer ---------- */

.viewer {
  display: none;
  flex: 1;
  min-height: 0;
  padding: 14px;
}

body[data-view="demo"] .viewer { display: block; }

#pageFrame {
  width: 100%;
  height: 100%;
  border: none;
  border-radius: 16px;
  background: #fff;
  box-shadow: 0 24px 80px rgba(0, 0, 0, 0.45);
}

/* ---------- Responsive ---------- */

@media (max-width: 900px) {
  .app { grid-template-columns: minmax(0, 1fr); }

  .rail {
    position: fixed;
    inset: 0 auto 0 0;
    width: min(84vw, var(--rail-w));
    z-index: 40;
    transform: translateX(-100%);
    transition: transform 0.24s ease;
  }

  body[data-rail="open"] .rail { transform: none; }

  body[data-rail="open"] .scrim { display: block; }

  .topbar { display: flex; }

  .rail-toggle {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 38px;
    height: 38px;
    padding: 0;
    flex-shrink: 0;
  }

  .home { padding: 40px 22px 84px; }
  .home p { max-width: 26ch; }
  .viewer { padding: 10px; }
}

@media (prefers-reduced-motion: reduce) {
  * { animation: none !important; transition: none !important; }
  .reveal { opacity: 1; transform: none; }
}
</style>
</head>
<body data-view="home">

<div class="app">
  <aside class="rail" id="rail">
    <div class="rail-head">
      <div class="rail-mark" aria-hidden="true"></div>
      <div class="rail-brand">Backstory</div>
    </div>

    <div class="nav-group">
      <button class="group-toggle" id="groupToggle" type="button" aria-expanded="true" aria-controls="navList" aria-label="Collapse Demo Hub">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M6 15L12 9L18 15" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </button>
      <a class="group-link" href="#" id="homeLink">Demo Hub</a>
    </div>

    <ul class="nav-list" id="navList"></ul>
  </aside>

  <div class="scrim" id="scrim"></div>

  <main class="main">
    <div class="topbar">
      <button class="bar-btn rail-toggle" id="railToggle" type="button" aria-label="Show navigation" aria-controls="rail" aria-expanded="false">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" aria-hidden="true">
          <path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
        </svg>
      </button>
      <div class="crumb">
        <a class="crumb-home" href="#">Demo Hub</a><span class="crumb-sep">/</span><span id="crumbCurrent"></span>
      </div>
      <div class="spacer"></div>
      <a class="bar-btn" id="openDirect" target="_blank" rel="noreferrer">Open direct</a>
    </div>

    <section class="home">
      <div class="badge reveal"><span aria-hidden="true"></span>Backstory</div>
      <h1 class="reveal">Demo Hub</h1>
      <p class="reveal">Examples of user experiences powered by Backstory Data.</p>
      <hr class="reveal">
    </section>

    <div class="home-foot">Backstory.ai&nbsp;&nbsp;|&nbsp;&nbsp;Internal Use Only</div>

    <section class="viewer">
      <iframe id="pageFrame" title="Demo viewer"></iframe>
    </section>
  </main>
</div>

<script>
const PAGES = [
  { key: "account-plan-windy-city", file: "demos/account-plan-windy-city.html", title: "Windy City - Account Plan" },
  { key: "account-plan-lakefront", file: "demos/account-plan-lakefront.html", title: "Lakefront - Account Plan" },
  { key: "account-analysis", file: "demos/account-analysis.html", title: "Account Analysis" },
  { key: "territory-design", file: "demos/territory-design.html", title: "Territory Design" },
  { key: "whitespace-david-park", file: "demos/whitespace-david-park.html", title: "Territory Expansion Map" }
];

const navList = document.getElementById("navList");
const groupToggle = document.getElementById("groupToggle");
const railToggle = document.getElementById("railToggle");
const scrim = document.getElementById("scrim");
const crumbCurrent = document.getElementById("crumbCurrent");
const openDirect = document.getElementById("openDirect");
const frame = document.getElementById("pageFrame");

function renderNav() {
  PAGES.forEach((page) => {
    const item = document.createElement("li");
    const link = document.createElement("a");
    link.className = "nav-link";
    link.href = "#" + page.key;
    link.textContent = page.title;
    link.dataset.key = page.key;
    item.appendChild(link);
    navList.appendChild(item);
  });
}

function setActive(key) {
  navList.querySelectorAll(".nav-link").forEach((link) => {
    const isActive = link.dataset.key === key;
    link.classList.toggle("active", isActive);
    if (isActive) link.setAttribute("aria-current", "page");
    else link.removeAttribute("aria-current");
  });
}

function setFrame(url) {
  try {
    frame.contentWindow.location.replace(url);
  } catch (error) {
    frame.src = url;
  }
}

function closeRail() {
  document.body.removeAttribute("data-rail");
  railToggle.setAttribute("aria-expanded", "false");
}

function showPage(page) {
  document.title = page.title + " | Backstory Demo Hub";
  document.body.dataset.view = "demo";
  crumbCurrent.textContent = page.title;
  openDirect.href = page.file;
  setActive(page.key);
  setFrame(page.file);
  closeRail();
}

function showHome() {
  document.title = "Demo Hub | Backstory";
  document.body.dataset.view = "home";
  setActive(null);
  setFrame("about:blank");
  closeRail();
}

function syncFromLocation() {
  const hash = window.location.hash.replace("#", "");
  const page = hash && PAGES.find((entry) => entry.key === hash);
  if (page) showPage(page);
  else showHome();
}

groupToggle.addEventListener("click", () => {
  const expanded = groupToggle.getAttribute("aria-expanded") === "true";
  groupToggle.setAttribute("aria-expanded", String(!expanded));
  groupToggle.setAttribute("aria-label", expanded ? "Expand Demo Hub" : "Collapse Demo Hub");
  navList.hidden = expanded;
});

railToggle.addEventListener("click", () => {
  const open = document.body.dataset.rail === "open";
  if (open) closeRail();
  else {
    document.body.dataset.rail = "open";
    railToggle.setAttribute("aria-expanded", "true");
  }
});

scrim.addEventListener("click", closeRail);

document.addEventListener("keydown", (event) => {
  if (event.key === "Escape") closeRail();
});

window.addEventListener("hashchange", syncFromLocation);

renderNav();
syncFromLocation();
</script>

</body>
</html>
