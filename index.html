<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Digital Chief of Staff — Workspace Library</title>
<link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: 'Lexend', sans-serif; background: #1c1c1c; color: #f9f9f9; min-height: 100vh; }

/* INDEX VIEW */
#indexView { }
.header {
  background-image: url('assets/header-bg.png');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  padding: 96px 48px 110px;
  position: relative;
}
.header::after {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(180deg, rgba(0,0,0,0.05) 0%, rgba(0,0,0,0.25) 100%);
  pointer-events: none;
}
.header > * { position: relative; z-index: 1; }
.header h1 {
  font-size: 32pt; font-weight: 700; letter-spacing: -0.5px; margin-bottom: 8px;
  color: #fff; text-shadow: 0 2px 12px rgba(0,0,0,0.35);
}
.header .badge {
  display: inline-block; margin-top: 16px; padding: 6px 16px;
  border: 1px solid rgba(255,255,255,0.4); border-radius: 16px;
  font-size: 9pt; color: rgba(255,255,255,0.85); letter-spacing: 1.5px; text-transform: uppercase;
  background: rgba(0,0,0,0.2);
}
.demos { padding: 32px 48px 64px; }
.demos h2 {
  font-size: 11pt; font-weight: 600; letter-spacing: 2px; text-transform: uppercase;
  color: rgba(249,249,249,0.45); margin-bottom: 20px; padding-bottom: 12px;
  border-bottom: 1px solid rgba(255,255,255,0.1);
}
.demo-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
.demo-card {
  display: block; padding: 24px 28px; border-radius: 8px;
  background: rgba(255,255,255,0.04); border: 1px solid rgba(255,255,255,0.08);
  text-decoration: none; color: #f9f9f9; transition: all 0.2s; cursor: pointer;
}
.demo-card:hover {
  background: rgba(255,255,255,0.08); border-color: rgba(255,255,255,0.18);
  transform: translateY(-2px);
}
.demo-card .card-label {
  font-size: 9pt; font-weight: 500; letter-spacing: 1px; text-transform: uppercase;
  color: rgba(249,249,249,0.4); margin-bottom: 8px;
}
.demo-card .card-title { font-size: 14pt; font-weight: 600; margin-bottom: 6px; }
.demo-card .card-desc { font-size: 10pt; color: rgba(249,249,249,0.55); line-height: 1.5; }
.demo-card .arrow { float: right; font-size: 18px; color: rgba(249,249,249,0.3); margin-top: -4px; }
.demo-card:hover .arrow { color: #f9f9f9; }

/* PAGE VIEW */
#pageView { display: none; position: fixed; inset: 0; background: #1c1c1c; z-index: 100; }
#pageBar {
  height: 48px; background: #1a1a2e; display: flex; align-items: center;
  padding: 0 24px; border-bottom: 1px solid rgba(255,255,255,0.15); gap: 16px;
}
#pageBar a {
  color: #fff; text-decoration: none; font-size: 13px; display: flex; align-items: center; gap: 6px; cursor: pointer;
}
#pageBar a:hover { text-decoration: underline; }
#pageBar .divider { color: rgba(255,255,255,0.3); font-size: 12px; }
#pageBar .page-title { color: rgba(255,255,255,0.6); font-size: 12px; }
#pageFrame { width: 100%; height: calc(100vh - 48px); border: none; background: #fff; }

@media (max-width: 600px) {
  .header { padding: 32px 24px 40px; }
  .header h1 { font-size: 22pt; }
  .demos { padding: 24px; }
  .demo-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- INDEX VIEW -->
<div id="indexView">
  <div class="header">
    <h1>Backstory Workspace Library</h1>
    <div class="badge">Internal Workspace</div>
  </div>
  <div class="demos">
    <h2>Workspaces</h2>
    <div class="demo-grid" id="cardGrid"></div>
  </div>
</div>

<!-- PAGE VIEW -->
<div id="pageView">
  <div id="pageBar">
    <a href="./" onclick="event.preventDefault(); goBack();">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/></svg>
      Back to Workspaces
    </a>
    <span class="divider">|</span>
    <span class="page-title" id="pageTitle"></span>
  </div>
  <iframe id="pageFrame"></iframe>
</div>

<script>
const PAGES = [
  { key: "account-plan-windy-city", file: "demos/account-plan-windy-city.html",
    label: "Account Plan", title: "Windy City Storage",
    desc: "Full account plan with strategic overview, stakeholder map, and opportunity pipeline." },
  { key: "account-plan-lakefront", file: "demos/account-plan-lakefront.html",
    label: "Account Plan", title: "Lakefront Technologies",
    desc: "Comprehensive account review with engagement timeline and expansion strategy." },
  { key: "mops-funnel", file: "demos/mops-funnel.html",
    label: "MOPS", title: "MOPS Funnel Analysis",
    desc: "Full funnel GAP analysis with conversion metrics and segment breakdowns." },
  { key: "pipeline-progression", file: "demos/pipeline-progression.html",
    label: "Rev Ops", title: "Pipeline Progression",
    desc: "Pipeline funnel analysis with stage-by-stage progression and velocity metrics." },
  { key: "out-quarter-pipeline", file: "demos/out-quarter-pipeline.html",
    label: "Rev Ops", title: "Out Quarter Pipeline",
    desc: "Q2–Q4 pipeline review with forecast categories and execution risk scoring." },
  { key: "whitespace-david-park", file: "demos/whitespace-david-park.html",
    label: "Whitespace", title: "David Park WhiteSpace",
    desc: "Territory whitespace and green space analysis with expansion opportunities." },
  { key: "territory-design", file: "demos/territory-design.html",
    label: "Territory Design", title: "Territory Expansion Map",
    desc: "Routing, reassignment, and seller-loadout planning for coverage design decisions." },
  { key: "account-analysis-se", file: "demos/account-analysis.html",
    label: "Account Analysis", title: "Alex Mercer Analysis",
    desc: "Customer expansion analysis with priority queues, activation gaps, and meeting guidance." }
];

const grid = document.getElementById('cardGrid');
PAGES.forEach(p => {
  // Anchor + onclick: if JS runs (normal hosting), openPage handles the
  // iframe viewer. If a host sandbox blocks JS (e.g. some Google Sites
  // embed configurations), the href still navigates the embed iframe
  // directly to the demo, which is the desired fallback.
  const card = document.createElement('a');
  card.className = 'demo-card';
  card.href = p.file;
  card.addEventListener('click', (e) => {
    if (e.metaKey || e.ctrlKey || e.shiftKey || e.button === 1) return;
    e.preventDefault();
    openPage(p);
  });
  card.innerHTML = `<span class="arrow">→</span><div class="card-label">${p.label}</div><div class="card-title">${p.title}</div><div class="card-desc">${p.desc}</div>`;
  grid.appendChild(card);
});

function setFrame(url) {
  // Use location.replace on the iframe so iframe nav doesn't add to parent history.
  // Setting iframe.src adds an entry, which would force two Back presses.
  const frame = document.getElementById('pageFrame');
  try { frame.contentWindow.location.replace(url); }
  catch (e) { frame.src = url; }
}

function showPage(p, push) {
  document.getElementById('pageTitle').textContent = p.title;
  document.getElementById('indexView').style.display = 'none';
  document.getElementById('pageView').style.display = 'block';
  setFrame(p.file);
  if (push) history.pushState({ page: p.key }, '', '#' + p.key);
}

function showIndex() {
  document.getElementById('pageView').style.display = 'none';
  document.getElementById('indexView').style.display = 'block';
  setFrame('about:blank');
}

function openPage(p) { showPage(p, true); }

function goBack() {
  // Let the browser handle history — popstate will flip the view.
  if (window.location.hash) history.back();
  else showIndex();
}

// Deep-link support: open the demo if the URL has a hash
window.addEventListener('DOMContentLoaded', () => {
  const hash = window.location.hash.replace('#', '');
  if (hash) {
    const p = PAGES.find(x => x.key === hash);
    if (p) showPage(p, false);
  }
});
window.addEventListener('popstate', () => {
  const hash = window.location.hash.replace('#', '');
  if (hash) {
    const p = PAGES.find(x => x.key === hash);
    if (p) showPage(p, false); else showIndex();
  } else {
    showIndex();
  }
});
</script>

</body>
</html>
