<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Territory Expansion Map</title>
<style>
*,
*::before,
*::after { box-sizing: border-box; }

html,
body { margin: 0; padding: 0; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  background: #f1f5f9;
  color: #1e293b;
  font-size: 14px;
  line-height: 1.5;
}

button,
input {
  font: inherit;
}

.stats-bar {
  background: #fff;
  padding: 12px 32px;
  border-bottom: 1px solid #e2e8f0;
  display: flex;
  gap: 26px;
  flex-wrap: wrap;
  align-items: center;
  position: sticky;
  top: 0;
  z-index: 40;
  box-shadow: 0 2px 8px rgba(0, 0, 0, 0.07);
}

.stat-chip .val {
  font-size: 20px;
  font-weight: 800;
  line-height: 1.1;
}

.stat-chip .lbl {
  font-size: 10px;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.5px;
}

.nav {
  display: flex;
  gap: 3px;
  padding: 14px 32px 0;
  overflow-x: auto;
  background: #f1f5f9;
}

.tab {
  padding: 8px 13px;
  border-radius: 8px 8px 0 0;
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  background: #e2e8f0;
  color: #64748b;
  border: none;
  white-space: nowrap;
  transition: background 0.15s;
}

.tab:hover {
  background: #cbd5e1;
}

.tab.active {
  background: #fff;
  color: #1e293b;
  box-shadow: 0 -2px 6px rgba(0, 0, 0, 0.05);
}

.summary-row {
  padding: 18px 32px 0;
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.sum-card {
  border-radius: 10px;
  padding: 14px 16px;
  border: 1px solid #dbe5ec;
  background: #fff;
}

.sum-card.keep { border-top: 3px solid #15803d; }
.sum-card.review { border-top: 3px solid #b45309; }
.sum-card.release { border-top: 3px solid #991b1b; }
.sum-card.assign { border-top: 3px solid #0369a1; }

.sum-lbl {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: #64748b;
  margin-bottom: 6px;
}

.sum-num {
  font-size: 28px;
  font-weight: 800;
  line-height: 1;
  color: #111827;
}

.sum-sub {
  margin-top: 8px;
  font-size: 12px;
  color: #64748b;
}

.filter-row {
  padding: 10px 32px 8px;
  background: #f8fafc;
  border-bottom: 1px solid #e2e8f0;
  display: flex;
  gap: 6px;
  align-items: center;
  flex-wrap: wrap;
}

.sig-chip {
  padding: 4px 10px;
  border-radius: 16px;
  border: 1.5px solid #e2e8f0;
  background: #fff;
  color: #374151;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.15s;
}

.sig-chip:hover {
  border-color: #6296ad;
  color: #6296ad;
}

.sig-chip.sig-active { color: #fff; }
.sig-chip.conn-chip.sig-active { background: #10b981; border-color: #10b981; }
.sig-chip.fe-chip.sig-active { background: #6296ad; border-color: #6296ad; }
.sig-chip.warm-chip.sig-active { background: #9333ea; border-color: #9333ea; }
.sig-chip.opp-chip.sig-active { background: #16a34a; border-color: #16a34a; }
.sig-chip.keep-chip.sig-active { background: #16a34a; border-color: #16a34a; }
.sig-chip.review-chip.sig-active { background: #d97706; border-color: #d97706; }
.sig-chip.release-chip.sig-active { background: #dc2626; border-color: #dc2626; }
.sig-chip.assign-chip.sig-active { background: #0369a1; border-color: #0369a1; }

.clear-btn {
  margin-left: 8px;
  padding: 4px 10px;
  border-radius: 16px;
  border: none;
  background: #f1f5f9;
  color: #64748b;
  font-size: 11px;
  font-weight: 600;
  cursor: pointer;
}

.clear-btn:hover {
  background: #e2e8f0;
  color: #1e293b;
}

.search-row {
  padding: 10px 32px;
  background: #f1f5f9;
  display: flex;
  gap: 12px;
  align-items: center;
  flex-wrap: wrap;
}

.search-row input {
  width: 100%;
  max-width: 420px;
  padding: 9px 14px;
  border: 1.5px solid #cbd5e1;
  border-radius: 8px;
  font-size: 13px;
  outline: none;
  background: #fff;
}

.search-row input:focus {
  border-color: #6296ad;
  box-shadow: 0 0 0 3px rgba(98, 150, 173, 0.15);
}

.owner-pills {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.owner-pill {
  padding: 5px 10px;
  border-radius: 16px;
  border: 1px solid #dbe5ec;
  background: #fff;
  color: #475569;
  font-size: 11px;
  font-weight: 700;
  cursor: pointer;
}

.owner-pill.active {
  color: #fff;
  border-color: transparent;
}

.tab-content {
  display: none;
  padding: 18px 32px 40px;
}

.tab-content.active {
  display: block;
}

.section-title {
  font-size: 15px;
  font-weight: 800;
  color: #1e293b;
  margin-bottom: 12px;
}

.hint {
  font-size: 11px;
  color: #555;
  background: #fff;
  border: 1px solid #ddd;
  border-left: 3px solid #000;
  border-radius: 4px;
  padding: 8px 12px;
  margin-bottom: 18px;
}

.table-wrap {
  overflow-x: auto;
  border-radius: 10px;
  box-shadow: 0 1px 5px rgba(0, 0, 0, 0.07);
  background: #fff;
  margin-bottom: 20px;
}

.acc-table {
  width: 100%;
  min-width: 980px;
  border-collapse: collapse;
  background: #fff;
  font-size: 13px;
}

.acc-table thead tr {
  background: #f8fafc;
  border-bottom: 2px solid #e2e8f0;
}

.acc-table th {
  padding: 9px 10px;
  text-align: left;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: #94a3b8;
  white-space: nowrap;
}

.acc-table tbody tr.acc-row {
  border-bottom: 1px solid #f1f5f9;
  cursor: pointer;
  transition: background 0.1s;
}

.acc-table tbody tr.acc-row:hover {
  background: #e8f1f5;
}

.acc-table td {
  padding: 10px 10px;
  vertical-align: top;
}

.th-sort {
  cursor: pointer;
  user-select: none;
}

.th-sort:hover {
  background: #e2e8f0;
}

.th-sort.sort-asc::after {
  content: " ^";
  font-size: 9px;
}

.th-sort.sort-desc::after {
  content: " v";
  font-size: 9px;
}

.acc-name {
  font-weight: 700;
  color: #1e293b;
}

.acc-sub {
  font-size: 11px;
  color: #64748b;
  margin-top: 2px;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
  gap: 12px;
  margin-bottom: 20px;
}

.rep-card {
  background: #fff;
  border-radius: 10px;
  padding: 15px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
  cursor: pointer;
  transition: box-shadow 0.2s, transform 0.15s;
  border: 1px solid transparent;
}

.rep-card:hover {
  box-shadow: 0 5px 16px rgba(0, 0, 0, 0.11);
  transform: translateY(-2px);
}

.rep-card.active {
  border-color: #cbd5e1;
}

.rep-card-top {
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 10px;
}

.rep-avatar {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 14px;
  font-weight: 800;
  flex-shrink: 0;
}

.rep-card-name {
  font-weight: 800;
  font-size: 13px;
  color: #1e293b;
}

.rep-card-sub {
  font-size: 11px;
  color: #64748b;
}

.rep-card-foot {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  font-size: 11px;
}

.rep-card-foot span {
  font-weight: 600;
}

.rep-card-actions {
  display: flex;
  gap: 8px;
  margin-top: 12px;
}

.rep-card-btn,
.mini-btn {
  padding: 4px 8px;
  border-radius: 8px;
  border: 1px solid #e2e8f0;
  background: #fff;
  cursor: pointer;
  font-size: 12px;
  transition: background 0.15s;
}

.rep-card-btn:hover,
.mini-btn:hover {
  background: #f1f5f9;
}

.rep-hdr {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 14px;
  padding: 14px 16px;
  background: #fff;
  border-radius: 10px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
  flex-wrap: wrap;
}

.rep-hdr-copy {
  flex: 1;
  min-width: 240px;
}

.rep-hdr-name {
  font-size: 17px;
  font-weight: 800;
  color: #1e293b;
}

.rep-hdr-meta {
  font-size: 12px;
  color: #64748b;
  margin-top: 2px;
}

.rep-hdr-actions {
  display: flex;
  gap: 6px;
  flex-wrap: wrap;
}

.mini-btn.active {
  background: #1e293b;
  color: #fff;
  border-color: #1e293b;
}

.summary-table td {
  padding: 10px 12px;
}

.summary-table .num {
  font-size: 15px;
  font-weight: 800;
}

.badge {
  display: inline-block;
  padding: 2px 7px;
  border-radius: 12px;
  font-size: 10px;
  font-weight: 700;
  margin-right: 3px;
  white-space: nowrap;
}

.b-keep { background: #f0fdf4; color: #15803d; border: 1px solid #86efac; }
.b-review { background: #fffbeb; color: #b45309; border: 1px solid #fde68a; }
.b-release { background: #fef2f2; color: #991b1b; border: 1px solid #fecaca; }
.b-assign { background: #eff6ff; color: #0369a1; border: 1px solid #93c5fd; }
.b-conn { background: #ecfdf5; color: #059669; border: 1px solid #6ee7b7; }
.b-fe { background: #e8f1f5; color: #6296ad; border: 1px solid #a8c4d1; }
.b-intent { background: #fff7ed; color: #c2410c; border: 1px solid #fed7aa; }
.b-warm { background: #fdf4ff; color: #9333ea; border: 1px solid #d8b4fe; }
.b-opp { background: #f0fdf4; color: #16a34a; border: 1px solid #86efac; }
.b-locked { background: #f1f5f9; color: #64748b; border: 1px solid #e2e8f0; }

.owner-link {
  padding: 0;
  border: none;
  background: none;
  color: #0f4c81;
  font-size: 12px;
  font-weight: 700;
  cursor: pointer;
}

.owner-link:hover {
  text-decoration: underline;
}

.route-arrow {
  color: #94a3b8;
  margin: 0 4px;
}

.queue-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
}

.queue-col {
  min-width: 0;
}

.queue-head {
  background: #fff;
  border-radius: 10px;
  padding: 14px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
  margin-bottom: 10px;
}

.queue-title {
  font-size: 15px;
  font-weight: 800;
}

.queue-sub {
  font-size: 11px;
  color: #64748b;
  margin-top: 4px;
}

.queue-card {
  width: 100%;
  text-align: left;
  border: none;
  border-radius: 10px;
  padding: 12px;
  background: #fff;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
  margin-bottom: 10px;
  cursor: pointer;
}

.queue-card:hover {
  background: #f8fafc;
}

.queue-card-title {
  font-weight: 700;
  color: #1e293b;
}

.queue-card-copy {
  margin-top: 6px;
  font-size: 12px;
  color: #64748b;
  line-height: 1.55;
}

.queue-card-foot {
  margin-top: 8px;
  font-size: 11px;
  color: #475569;
}

.empty-state {
  padding: 20px;
  background: #fff;
  border-radius: 10px;
  color: #64748b;
  font-size: 12px;
  box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
}

.overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(15, 23, 42, 0.6);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
  backdrop-filter: blur(4px);
}

.overlay.open {
  display: flex;
}

.modal,
.profile-modal {
  background: #fff;
  border-radius: 16px;
  width: 100%;
  max-height: 88vh;
  overflow-y: auto;
  box-shadow: 0 30px 70px rgba(0, 0, 0, 0.3);
}

.modal {
  max-width: 680px;
}

.profile-modal {
  max-width: 820px;
}

.modal-hdr {
  padding: 20px 24px 16px;
  border-bottom: 1px solid #f1f5f9;
  position: sticky;
  top: 0;
  background: #fff;
  border-radius: 16px 16px 0 0;
  z-index: 1;
}

.modal-body {
  padding: 20px 24px 28px;
}

.m-section {
  margin-bottom: 20px;
}

.m-section-lbl {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.7px;
  color: #94a3b8;
  margin-bottom: 8px;
}

.metric-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
  gap: 8px;
}

.metric-card {
  background: #f8fafc;
  border-radius: 8px;
  padding: 10px 12px;
}

.metric-card .mc-lbl {
  font-size: 10px;
  color: #94a3b8;
  font-weight: 600;
  text-transform: uppercase;
  margin-bottom: 3px;
}

.metric-card .mc-val {
  font-size: 15px;
  font-weight: 800;
  color: #1e293b;
}

.why-box {
  background: #f8fafc;
  border: 1px solid #dbe5ec;
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 13px;
  color: #334155;
  line-height: 1.65;
}

.keep-box-keep,
.keep-box-review,
.keep-box-release,
.keep-box-assign {
  border-radius: 8px;
  padding: 12px 14px;
  font-size: 13px;
  line-height: 1.6;
}

.keep-box-keep { background: #f0fdf4; border: 1px solid #86efac; color: #166534; }
.keep-box-review { background: #fffbeb; border: 1px solid #fde68a; color: #92400e; }
.keep-box-release { background: #fef2f2; border: 1px solid #fecaca; color: #991b1b; }
.keep-box-assign { background: #eff6ff; border: 1px solid #93c5fd; color: #075985; }

.li-box {
  background: #eff6ff;
  border: 1px solid #bfdbfe;
  border-radius: 8px;
  padding: 12px 14px;
}

.contact-card {
  background: #f8fafc;
  border-radius: 8px;
  padding: 10px 12px;
  margin-bottom: 6px;
}

.contact-name {
  font-weight: 700;
  font-size: 13px;
  color: #1e293b;
}

.contact-title {
  font-size: 11px;
  color: #64748b;
  margin-top: 2px;
}

.contact-signal {
  font-size: 11px;
  color: #7c3aed;
  margin-top: 5px;
  line-height: 1.4;
}

.contact-link {
  color: #6296ad;
  font-weight: 600;
  text-decoration: none;
}

.contact-link:hover {
  text-decoration: underline;
}

.close-btn {
  position: absolute;
  top: 16px;
  right: 18px;
  background: none;
  border: none;
  font-size: 24px;
  cursor: pointer;
  color: #94a3b8;
  line-height: 1;
  padding: 4px 6px;
  border-radius: 6px;
}

.close-btn:hover {
  background: #f1f5f9;
  color: #1e293b;
}

.profile-grid {
  display: grid;
  grid-template-columns: 1.2fr 1fr;
  gap: 16px;
}

.profile-card {
  background: #f8fafc;
  border-radius: 10px;
  padding: 14px;
  border: 1px solid #e2e8f0;
}

.profile-card h3 {
  margin: 0 0 8px;
  font-size: 13px;
  text-transform: uppercase;
  letter-spacing: 0.6px;
  color: #64748b;
}

.profile-card p,
.profile-card li {
  font-size: 13px;
  color: #334155;
}

.profile-card ul {
  margin: 0;
  padding-left: 18px;
}

.profile-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 12px;
}

.profile-link {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 7px 10px;
  border-radius: 8px;
  background: #fff;
  border: 1px solid #dbe5ec;
  color: #0f4c81;
  text-decoration: none;
  font-size: 12px;
  font-weight: 700;
}

.profile-link:hover {
  background: #f8fafc;
}

.account-inline-list {
  display: grid;
  gap: 8px;
}

.account-inline {
  display: flex;
  justify-content: space-between;
  gap: 12px;
  align-items: center;
  padding: 10px 12px;
  border-radius: 8px;
  background: #fff;
  border: 1px solid #e2e8f0;
}

.account-inline button {
  padding: 4px 8px;
  border-radius: 8px;
  border: 1px solid #dbe5ec;
  background: #fff;
  cursor: pointer;
  font-size: 12px;
}

.account-inline button:hover {
  background: #f1f5f9;
}

body.modal-open {
  overflow: hidden;
}

@media (max-width: 1100px) {
  .summary-row,
  .queue-grid,
  .profile-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}

@media (max-width: 780px) {
  .stats-bar,
  .nav,
  .summary-row,
  .filter-row,
  .search-row,
  .tab-content {
    padding-left: 18px;
    padding-right: 18px;
  }

  .summary-row,
  .queue-grid,
  .profile-grid {
    grid-template-columns: 1fr;
  }

  .modal-hdr,
  .modal-body {
    padding-left: 16px;
    padding-right: 16px;
  }
}
</style>
</head>
<body>
<section class="stats-bar" id="statsBar"></section>

<div class="nav" id="tabs"></div>

<section class="summary-row" id="summaryRow"></section>

<div class="filter-row">
  <div id="filterRow"></div>
  <button class="clear-btn" id="clearFilters">Reset Filters</button>
</div>

<div class="search-row">
  <input id="searchInput" type="search" placeholder="Search account, owner, region, or segment">
  <div class="owner-pills" id="ownerPills"></div>
</div>

<div class="tab-content active" id="tab_overview"></div>
<div class="tab-content" id="tab_reps"></div>
<div class="tab-content" id="tab_queue"></div>

<div class="overlay" id="accountOverlay">
  <div class="modal" id="accountModal">
    <div class="modal-hdr">
      <button class="close-btn" id="closeAccountModal" aria-label="Close">x</button>
      <div style="display:flex;align-items:center;gap:10px;margin-bottom:10px;">
        <div id="mDot" style="width:14px;height:14px;border-radius:50%;background:#9ca3af;flex-shrink:0;"></div>
        <div id="mName" style="font-size:20px;font-weight:800;color:#1e293b;line-height:1.1;"></div>
      </div>
      <div id="mMeta" style="font-size:12px;color:#64748b;margin-bottom:10px;"></div>
      <div id="mBadges" style="display:flex;gap:6px;flex-wrap:wrap;"></div>
    </div>
    <div class="modal-body">
      <div class="m-section">
        <div class="m-section-lbl">Account Recommendation</div>
        <div id="mKeepBox"></div>
      </div>

      <div class="m-section">
        <div class="m-section-lbl">Why This Account</div>
        <div class="why-box" id="mWhy"></div>
      </div>

      <div class="m-section">
        <div class="m-section-lbl">Key Metrics</div>
        <div class="metric-grid" id="mMetrics"></div>
      </div>

      <div class="m-section">
        <div class="m-section-lbl">Assigned Rep</div>
        <div id="mRep" class="why-box"></div>
      </div>

      <div class="m-section" id="mConnSec" style="display:none;">
        <div class="m-section-lbl">LinkedIn 1st Connections</div>
        <div id="mConnBody"></div>
      </div>

      <div class="m-section" id="mFESec" style="display:none;">
        <div class="m-section-lbl">Former Employer</div>
        <div id="mFEBody"></div>
      </div>

      <div class="m-section" id="mChampSec" style="display:none;">
        <div class="m-section-lbl">Champion Contacts</div>
        <div id="mChampBody"></div>
      </div>

      <div class="m-section" id="mWarmSec" style="display:none;">
        <div class="m-section-lbl">Warm Leads</div>
        <div id="mWarmBody"></div>
      </div>
    </div>
  </div>

}

function getBestConnectionCount(account) {
  return Object.values(account.li_connections || {}).reduce((best, contacts) => Math.max(best, contacts.length), 0);
}

function hasConnections(account) {
  return getBestConnectionCount(account) > 0;
}

function hasFormerEmployer(account) {
  return (account.formerEmployerReps || []).length > 0;
}

function hasWarmLead(account) {
  return (account.warm_leads || []).length > 0;
}

function ownerButton(name) {
  if (!name || name === "Open Pool") return '<span style="color:#64748b;">Open Pool</span>';
  const rep = getRepByName(name);
  if (!rep) return name;
  return '<button class="owner-link" data-open-rep="' + rep.id + '">' + rep.name + "</button>";
}

function routeCell(account) {
  if (account.currentOwner === account.suggestedOwner) return ownerButton(account.suggestedOwner);
  return ownerButton(account.currentOwner) + '<span class="route-arrow">to</span>' + ownerButton(account.suggestedOwner);
}

function accountMatchesGlobalFilters(account) {
  const search = state.search.trim().toLowerCase();
  if (search) {
    const hay = [
      account.account_name,
      account.classification,
      account.region,
      account.currentOwner,
      account.suggestedOwner,
      account.website
    ].join(" ").toLowerCase();
    if (!hay.includes(search)) return false;
  }

  if (state.ownerFilter !== "all") {
    const targetRep = getRepById(state.ownerFilter);
    if (!targetRep) return false;
    const ownerMatch = account.currentOwner === targetRep.name || account.suggestedOwner === targetRep.name;
    if (!ownerMatch) return false;
  }

  for (const filter of state.selectedFilters) {
    if (filter === "conn" && !hasConnections(account)) return false;
    if (filter === "fe" && !hasFormerEmployer(account)) return false;
    if (filter === "warm" && !hasWarmLead(account)) return false;
    if (filter === "opp" && !(account.open_opps > 0)) return false;
    if ((filter === "keep" || filter === "review" || filter === "release" || filter === "assign") && getRecommendationKey(account) !== filter) return false;
  }

  return true;
}

function compareValues(left, right, dir) {
  if (typeof left === "string" || typeof right === "string") return String(left).localeCompare(String(right)) * dir;
  return (left - right) * dir;
}

function sortAccounts(list) {
  const dir = state.sortDir === "asc" ? 1 : -1;
  const order = { keep: 4, review: 3, assign: 2, release: 1 };
  return [...list].sort((a, b) => {
    if (state.sortKey === "recommendation") return compareValues(order[getRecommendationKey(a)], order[getRecommendationKey(b)], dir);
    if (state.sortKey === "connectionCount") return compareValues(getBestConnectionCount(a), getBestConnectionCount(b), dir);
    return compareValues(a[state.sortKey], b[state.sortKey], dir);
  });
}

function getVisibleAccounts() {
  return sortAccounts(accounts.filter(accountMatchesGlobalFilters));
}

function getRepPortfolio(rep) {
  return accounts.filter((account) => account.currentOwner === rep.name || account.suggestedOwner === rep.name);
}

function getRepSuggestedBook(rep) {
  return accounts.filter((account) => account.suggestedOwner === rep.name);
}

function getRepStats(rep) {
  const currentBook = accounts.filter((account) => account.currentOwner === rep.name);
  const suggestedBook = getRepSuggestedBook(rep);
  const connectionPaths = sum(
    accounts.map((account) => ((account.li_connections || {})[rep.name] || []).length)
  );

  return {
    currentCount: currentBook.length,
    currentTam: sum(currentBook.map((account) => account.tam)),
    suggestedCount: suggestedBook.length,
    suggestedTam: sum(suggestedBook.map((account) => account.tam)),
    keepCount: suggestedBook.filter((account) => getRecommendationKey(account) === "keep").length,
    reviewCount: suggestedBook.filter((account) => getRecommendationKey(account) === "review").length,
    releaseCount: currentBook.filter((account) => getRecommendationKey(account) === "release").length,
    assignCount: suggestedBook.filter((account) => getRecommendationKey(account) === "assign").length,
    connectionPaths,
    formerEmployerCount: accounts.filter((account) => (account.formerEmployerReps || []).includes(rep.name)).length
  };
}

  if (bestConn > 0) html += '<span class="badge b-conn">1st Conn (' + bestConn + ")</span> ";
  if (hasFormerEmployer(account)) html += '<span class="badge b-fe">F. Employer</span> ';
  if (account.intent && account.intent !== "Low") html += '<span class="badge b-intent">' + account.intent + " Intent</span> ";
  if (hasWarmLead(account)) html += '<span class="badge b-warm">Warm Lead</span> ';
  if (account.open_opps > 0) html += '<span class="badge b-opp">' + account.open_opps + " Opp</span> ";
  if (account.currentOwner !== "Open Pool" && account.currentOwner === account.suggestedOwner) html += '<span class="badge ' + getRecommendationClass(account) + '">' + getRecommendationLabel(account) + "</span> ";
  if (account.currentOwner === "Open Pool" || account.currentOwner !== account.suggestedOwner) html += '<span class="badge ' + getRecommendationClass(account) + '">' + getRecommendationLabel(account) + "</span> ";
  return html;

  if ((acc.formerEmployerReps || []).length) {
    feSection.style.display = "block";
    feBody.innerHTML = '<div class="li-box">' + acc.formerEmployerReps.map((repName) => {
      const rep = getRepByName(repName);
      return (
        '<div style="display:flex;align-items:center;gap:8px;padding:4px 0;">' +
        '<div class="rep-avatar" style="background:' + (rep ? rep.color : "#64748b") + ';width:24px;height:24px;font-size:10px;">' + (rep ? rep.initials : repName.slice(0, 2).toUpperCase()) + "</div>" +
        '<span style="font-size:13px;font-weight:600;color:#6296ad;">' + repName + " is a former employee</span></div>"
      );
    }).join("") + "</div>";
  } else {
    feSection.style.display = "none";
    feBody.innerHTML = "";
  }

  const champSection = document.getElementById("mChampSec");
  const champBody = document.getElementById("mChampBody");
  if ((acc.champions || []).length) {
    champSection.style.display = "block";
    champBody.innerHTML = acc.champions.map((contact) =>
      '<div class="contact-card"><div class="contact-name"><a class="contact-link" href="' + contact.linkedin + '" target="_blank" rel="noreferrer">' + contact.name + "</a></div>" +
      '<div class="contact-title">' + contact.title + "</div><div class=\"contact-signal\">" + contact.signal + "</div></div>"
    ).join("");
  } else {
    champSection.style.display = "none";
    champBody.innerHTML = "";
  }

  const warmSection = document.getElementById("mWarmSec");
  const warmBody = document.getElementById("mWarmBody");
  if ((acc.warm_leads || []).length) {
    warmSection.style.display = "block";
    warmBody.innerHTML = acc.warm_leads.map((contact) =>
      '<div class="contact-card"><div class="contact-name"><a class="contact-link" href="' + contact.linkedin + '" target="_blank" rel="noreferrer">' + contact.name + "</a></div>" +
      '<div class="contact-title">' + contact.title + "</div><div class=\"contact-signal\">" + contact.signal + "</div></div>"
    ).join("");
  } else {
    warmSection.style.display = "none";
    warmBody.innerHTML = "";
  }

  document.getElementById("accountOverlay").classList.add("open");
  document.body.classList.add("modal-open");
}

function openRepModal(repId) {
  const rep = getRepById(repId);
  if (!rep) return;

  state.activeRepId = repId;
  const stats = getRepStats(rep);
  const suggestedBook = sortAccounts(getRepSuggestedBook(rep));
  const connectionCards = [];

  accounts.forEach((account) => {
    const contacts = ((account.li_connections || {})[rep.name]) || [];
    contacts.forEach((contact) => {
      connectionCards.push({ account: account.account_name, contact });
    });
  });

  document.getElementById("rpAvatar").style.background = rep.color;
  document.getElementById("rpAvatar").textContent = rep.initials;
  document.getElementById("rpName").textContent = rep.name;
  document.getElementById("rpRole").textContent = rep.title + " | " + rep.territory + " | " + rep.location;
  document.getElementById("rpActions").innerHTML =
    '<a class="profile-link" href="' + rep.linkedin + '" target="_blank" rel="noreferrer">LinkedIn Profile</a>' +
    '<button class="profile-link" data-open-book="' + rep.id + '" style="border:none;background:#fff;cursor:pointer;">Open Book</button>';

  document.getElementById("rpMetrics").innerHTML =
    '<div class="metric-card"><div class="mc-lbl">Current Book</div><div class="mc-val">' + stats.currentCount + "</div></div>" +
    '<div class="metric-card"><div class="mc-lbl">Suggested Book</div><div class="mc-val">' + stats.suggestedCount + "</div></div>" +
    '<div class="metric-card"><div class="mc-lbl">Suggested TAM</div><div class="mc-val">' + shortMoney(stats.suggestedTam) + "</div></div>" +
    '<div class="metric-card"><div class="mc-lbl">1st Conn Paths</div><div class="mc-val">' + stats.connectionPaths + "</div></div>" +
    '<div class="metric-card"><div class="mc-lbl">Former Employer</div><div class="mc-val">' + stats.formerEmployerCount + "</div></div>" +
    '<div class="metric-card"><div class="mc-lbl">Territory</div><div class="mc-val">' + rep.territory + "</div></div>";

  document.getElementById("rpSummary").textContent = rep.summary;
  document.getElementById("rpFocus").textContent = rep.focus;
  document.getElementById("rpFormerEmployers").innerHTML = rep.formerEmployers.map((item) => "<li>" + item + "</li>").join("");
  document.getElementById("rpHighlights").innerHTML = rep.highlights.map((item) => "<li>" + item + "</li>").join("");

  document.getElementById("rpConnections").innerHTML = connectionCards.length ? connectionCards.slice(0, 8).map((item) =>
    '<div class="contact-card"><div class="contact-name"><a class="contact-link" href="' + item.contact.url + '" target="_blank" rel="noreferrer">' + item.contact.name + "</a></div>" +
    '<div class="contact-title">' + item.contact.title + " | " + item.account + "</div></div>"
  ).join("") : '<div class="empty-state">No LinkedIn-path contacts are mapped for this rep yet.</div>';

  document.getElementById("rpAccounts").innerHTML = suggestedBook.map((account) =>
    '<div class="account-inline"><div><div class="acc-name">' + account.account_name + '</div><div class="acc-sub">' + shortMoney(account.tam) + " | " + getRecommendationLabel(account) + "</div></div>" +
    '<button data-open-account="' + account.id + '">Open Account</button></div>'
  ).join("");

  document.getElementById("repOverlay").classList.add("open");
  document.body.classList.add("modal-open");
}

function closeAccountModal() {
  state.activeAccountId = null;
  document.getElementById("accountOverlay").classList.remove("open");
  if (!document.getElementById("repOverlay").classList.contains("open")) document.body.classList.remove("modal-open");
}

function closeRepModal() {
  state.activeRepId = null;
  document.getElementById("repOverlay").classList.remove("open");
  if (!document.getElementById("accountOverlay").classList.contains("open")) document.body.classList.remove("modal-open");
}

function switchTab(tabKey) {
  state.activeTab = tabKey;
  renderAll();
}

function openBook(repId) {
  state.selectedRepId = repId;
  state.activeTab = "reps";
  renderAll();
  closeRepModal();
}

document.getElementById("tabs").addEventListener("click", (event) => {
  const tab = event.target.closest("[data-tab]");
  if (!tab) return;
  switchTab(tab.dataset.tab);
});

document.getElementById("filterRow").addEventListener("click", (event) => {
  const chip = event.target.closest("[data-filter]");
  if (!chip) return;
  const key = chip.dataset.filter;
  if (state.selectedFilters.has(key)) state.selectedFilters.delete(key);
  else state.selectedFilters.add(key);
  renderAll();
});

document.getElementById("clearFilters").addEventListener("click", () => {
  state.selectedFilters.clear();
  state.ownerFilter = "all";
  state.search = "";
  document.getElementById("searchInput").value = "";
  renderAll();
});

document.getElementById("searchInput").addEventListener("input", (event) => {
  state.search = event.target.value;
  renderAll();
});

document.getElementById("ownerPills").addEventListener("click", (event) => {
  const pill = event.target.closest("[data-owner]");
  if (!pill) return;
  state.ownerFilter = pill.dataset.owner;
  renderAll();
});

document.getElementById("tab_overview").addEventListener("click", (event) => {
  const sort = event.target.closest("[data-sort]");
  if (sort) {
    const key = sort.dataset.sort;
    if (state.sortKey === key) state.sortDir = state.sortDir === "asc" ? "desc" : "asc";
    else {
      state.sortKey = key;
      state.sortDir = key === "account_name" ? "asc" : "desc";
    }
    renderAll();
    return;
  }

  const openBookBtn = event.target.closest("[data-open-book]");
  if (openBookBtn) {
    openBook(openBookBtn.dataset.openBook);
    return;
  }

  const repProfile = event.target.closest("[data-open-rep]");
  if (repProfile) {
    openRepModal(repProfile.dataset.openRep);
    return;
  }

  const openAccount = event.target.closest("[data-open-account]");
  if (openAccount) openAccountModal(openAccount.dataset.openAccount);
});

document.getElementById("tab_reps").addEventListener("click", (event) => {
  const repProfile = event.target.closest("[data-open-rep]");
  if (repProfile) {
    openRepModal(repProfile.dataset.openRep);
    return;
  }

  const selectRep = event.target.closest("[data-select-rep]");
  if (selectRep) {
    state.selectedRepId = selectRep.dataset.selectRep;
    renderAll();
    return;
  }

  const repSignal = event.target.closest("[data-rep-signal]");
  if (repSignal) {
    state.repSignal = repSignal.dataset.repSignal;
    renderAll();
    return;
  }

  const openAccount = event.target.closest("[data-open-account]");
  if (openAccount) openAccountModal(openAccount.dataset.openAccount);
});

document.getElementById("tab_queue").addEventListener("click", (event) => {
  const openAccount = event.target.closest("[data-open-account]");
  if (openAccount) openAccountModal(openAccount.dataset.openAccount);
});

document.getElementById("accountOverlay").addEventListener("click", (event) => {
  if (event.target === event.currentTarget) closeAccountModal();
});

document.getElementById("repOverlay").addEventListener("click", (event) => {
  if (event.target === event.currentTarget) closeRepModal();
});

document.getElementById("closeAccountModal").addEventListener("click", closeAccountModal);
document.getElementById("closeRepModal").addEventListener("click", closeRepModal);

document.getElementById("accountModal").addEventListener("click", (event) => {
  const toggle = event.target.closest("[data-toggle-panel]");
  if (toggle) {
    const panel = document.getElementById(toggle.dataset.togglePanel);
    if (!panel) return;
    panel.style.display = panel.style.display === "none" ? "block" : "none";
    toggle.textContent = panel.style.display === "none" ? "View" : "Hide";
    return;
  }

  const openRep = event.target.closest("[data-open-rep]");
  if (openRep) {
    openRepModal(openRep.dataset.openRep);
    return;
  }
});

document.getElementById("repModal").addEventListener("click", (event) => {
  const openAccount = event.target.closest("[data-open-account]");
  if (openAccount) {
    openAccountModal(openAccount.dataset.openAccount);
    return;
  }

  const openBookBtn = event.target.closest("[data-open-book]");
  if (openBookBtn) {
    openBook(openBookBtn.dataset.openBook);
  }
});

document.addEventListener("keydown", (event) => {
  if (event.key !== "Escape") return;
  if (state.activeAccountId) closeAccountModal();
  if (state.activeRepId) closeRepModal();
});

renderAll();
</script>
</body>
</html>
